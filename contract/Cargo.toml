[package]
name = "zilium-zk-commodity"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.5.0", default-features = false, features = ["legacy", "unit-testing"] }
near-contract-standards = "5.5.0"
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

